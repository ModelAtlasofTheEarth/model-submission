---
name: M@TE submission form
description: Welcome to the M@TE submission form.
title: "Provide a title for your submission, this is only for GitHub"
labels: ["new model"]

body:

  - type: markdown
    attributes:
      value: "## Section 1: Information about your model"

  - type: input
    id: submitter
    attributes:
      label: submitter ORCID (or name)
      placeholder: "e.g., 0000-0002-1270-4377 (or, Carey, Sam)"
      description: "Please provide the ORCiD (or family name, given name) associated with the person submitting the model. This is not necessarily the model creator."
    validations:
      required: true

  - type: input
    id: slug
    attributes:
      label: slug
      placeholder: "e.g., carey-1965-expansion"
      description: "Please provide 'familyname-year-keyword'. This will be used as the name of the model repository, and be used in URLs/DOIs. "
    validations:
      required: true

  - type: dropdown
    id: model-license
    attributes:
      label: license
      description: "To include your model in the [M@TE collection](https://geonetwork.nci.org.au/geonetwork/srv/eng/catalog.search#/home) (and receive a DOI) you must select an open licence. The recommended license for datasets is [CC-BY-4.0](https://creativecommons.org/licenses/by/4.0/deed.en) . Please choose one of the following open licences or supply a url for a licence (preferably a link to license text) in the box below. By selecting a licence, you are warranting that you are the owner of  the Model and/or have the right to publish the Model under the following open licence. This license will cover all files/data you submit unless specified otherwise."
      options:
        - CC-BY-4.0
        - AGPL-3.0
        - GPL-3.0
        - LGPL-3.0
        - MPL-2.0
        - Apache-2.0
        - MIT
        - BSL-1.0
        - Unlicense
        - alternative
    validations:
      required: true
  
  - type: input
    id: alt_licence_url
    attributes:
      label: alternative license URL
      description: "If an alternative (open) license is required, please provide a URL."
  
  - type: textarea
    id: description
    attributes:
      label: description
      render: text
      placeholder: "This model was developed in order to...."
      description: "A brief plain language model description < 100 words."
    validations:
      required: true

  - type: dropdown
    id: about_metadata_tags
    attributes:
      label: model category
      description: "Select relevant fields"
      multiple: true
      options:
        - "forward model"
        - "inverse model"
    validations:
      required: true

  - type: dropdown
    id: status_metadata_tags
    attributes:
      label: model status
      description: "Select relevant fields"
      multiple: false
      options:
        - "completed"
        - "ongoing"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "<br/>"

  - type: markdown
    attributes:
      value: |
          ---
          #### All fields below, in section 1, will be automatically populated using the publication DOI _after_ the form is submitted. If no publication DOI is available, please skip the following publication DOI field and complete all of the subsequent fields manually.
        
  - type: input
    id: pub_doi
    attributes:
      label: publication DOI
      placeholder: "e.g., https://doi.org/10.47366/sabia.v5n1a3."
      description: "The DOI will be used to automatically fill metadata information after the submission is made."
  
  - type: input
    id: title
    attributes:
      label: title
      placeholder: "e.g., title of you model"
      description: "Title of the model on the M@TE website, will be fetched from the publication DOI if left empty"
  
  - type: textarea
    id: c_authors
    attributes:
      label: contributing authors
      render: text
      placeholder: "e.g., ORCID iD (or Citizen, Jane)"
      description: "All authors from the publication DOI will be added after the submission is made. If no DOI is provided then fill the ORCIDs of the authors, one per line."
      
  - type: textarea
    id: abstract
    attributes:
      label: abstract
      render: text
      placeholder: "Your scientific abstract"
      description: "Abstract"

  - type: input
    id: keywords
    attributes:
      label: scientific keywords
      placeholder: "e.g., keyword1, keyword2, ..."
      description: "Keywords"

  - type: textarea
    id: funder_ROR_URI
    attributes:
      label: funder
      render: text
      placeholder: |
        https://www.arc.gov.au/, myGrant#id
        Another funding body
        https://ror.org/021nxhr62, another_grant_ID
      description: |
        Please provide the funding bodies, please use the following formatting options.
        "funding body, grant_id". 
        **Funding body** is preferably an ROR-URL, but can also be a Organizational URL, or simply a name in plain text.
        Search for RORs here: https://ror.org/
        The **grant_id** part is optional.

  - type: markdown
    attributes:
      value: "## Section 2: metadata for your model inputs, code and outputs"

  - type: markdown
    attributes:
      value: "This section captures information about your model's inputs, code, and outputs. The upload of the actual model code, input files, and outputs takes place at a later stage, once your submission has been approved."
  
  - type: textarea
    id: model_links
    attributes:
      render: text
      label: model links
      placeholder: "e.g., https://doi.org/10.47366/sabia.v5n1a3."
      description: "Provide any existing links where your model's inputs and/or outputs are stored (e.g., GitHub, Zenodo). Multiple links or DOIs can be included."
  
  - type: checkboxes
    id: input_included
    attributes:
      label: include model inputs?
      options:
        - label: "yes"
      description: "Are you submitting your model's input files, including initial and boundary conditions and all other files required to run the model?"
    validations:
      required: true

  - type: textarea
    id: input_notes
    attributes:
      render: text
      label: model input usage, a.k.a reproducibility
      placeholder: "e.g., Model is setup with a Python script, model.py, with X parameter provided as an argument"
      description: "Briefly describe how to set up and use your input files to reproduce the model, including any required configurations or parameters."

  - type: checkboxes
    id: output_included
    attributes:
      label: include model output?
      options:
        - label: "yes"
      description: "Are you submitting your model's output files."
    validations:
      required: true

  - type: textarea
    id: output_notes
    attributes:
      label: model output notes
      render: text
      placeholder: "e.g., output data primarily consists of ~ 1000 *.vtk files, each representing an output timestep, with a total size of 66 Gb."
      description: "Provide a basic description of your output data"

  - type: input
    id: output_size
    attributes:
      label: model output size
      placeholder: "e.g., Model output have a total size of ~ 128 Gb."
      description: "Provide an estimate of the total file size you wish to contribute."

  - type: input
    id: request_embargo
    attributes:
      label: model embargo?
      placeholder: "Leave blank if No, if YES, provide a date in the form e.g., 1964-02-29"
      description: |
        If you would like to request an embargo period, please provide an estimated end date in the form [1964-02-29] (i.e '%Y-%m-%d').
        Model submission can proceeed as normal, and you will recieve a DOI once submission is complete.
        Model components (input code, output data) will only become downloadable on the M@TE NCI collection, once the embargo has ended.

  - type: markdown
    attributes:
      value: | 
        ## Section 3: software and compute details

        #### All fields below, in section 3, will be automatically populated using the software DOI/URI.
        
  - type: textarea
    id: software_framework_doi_uri
    attributes:
      label: software DOI/URI
      render: text
      placeholder: "e.g., https://doi.org/10.5281/zenodo.7455999"
      description: |
        DOI/URI of the Software used. Enter one DOI/URI per line, this will automatically populate the following fields in section 3.
        If you don't add a DOI/URI here, you must enter the subsequent fields in section 3.

  - type: textarea
    id: software_framework
    attributes:
      label: Provide the name of the software (e.g. Underworld, ASPECT, Badlands, OpenFOAM)
      render: text
      placeholder: "e.g., Underworld2"
      description: "Enter one software framework name per line, in the same order as the software DOI/URI field. The name will be fetched from the DOI when a line is left blank."

  - type: textarea
    id: software_framework_authors
    attributes:
      render: text
      label: software authors
      placeholder: "e.g., ORCID iD (or Citizen, Jane)"
      description: "Enter one software framework per line, in the same order as the software DOI/URI field. Separate multiple authors for one framework with semicolons. If blank, authors from the software DOI will be used."

  - type: textarea
    id: software_framework_repository
    attributes:
      label: Software source repository
      render: text
      placeholder: "e.g., https://github.com/underworldcode/underworld2"
      description: "Enter one source repository per line, in the same order as the software DOI/URI field. Leave a line blank if unavailable."

  - type: textarea
    id: software_version_id
    attributes:
      label: Software version used.
      render: text
      placeholder: "e.g., v2.17.1"
      description: "Enter one tag, version, or commit SHA per line, in the same order as the software DOI/URI field. Leave a line blank if unavailable."

  - type: textarea
    id: software_keywords
    attributes:
      render: text
      label: software & algorithm keywords
      placeholder: "e.g., Python, Finite element, MPI ..."
      description: "Provide software and algorithm keywords for the model as a whole. Separate keywords with commas."

  - type: input
    id: compute_doi
    attributes:
      label: computer URI/DOI
      placeholder: "e.g., https://doi.org/10.47366/sabia.v5n1a3."
      description: "Provide a DOI/URI for the computation resource (if relavent)"


  - type: markdown
    attributes:
      value: "## Section 4: Visual and text materials for https://mate.science"

  - type: markdown
    attributes:
      value: "This section collects the visual and text materials used to present your model on the M@TE website."

  - type: textarea
    id: web_landing_page_image
    attributes:
      label: add landing page image
      placeholder: "e.g., Drag and drop image png"
      description: | 
        Provide a landing page image by dragging an image file into this box. Max file size is 2 Mb. PNG format only.
        Add a figure caption.
    validations:
      required: true

  - type: textarea
    id: web_animation
    attributes:
      label: add an animation
      placeholder: "e.g., Caption for model animation"
      description: |
        Provide an animation by dragging a file into this box. Only GIF and MP4 are supported. Max file size is 20 Mb.
        Add a animation caption.

  - type: textarea
    id: graphic_abstract
    attributes:
      label: add a graphic abstract figure
      placeholder: "e.g., Caption for graphic abstract"
      description: | 
        Provide a graphic abstract, or a figure that summariese key finding. Max file size is 2 Mb. PNG format only.
        Add a figure caption.

  - type: textarea
    id: model_setup
    attributes:
      label: add a model setup figure
      placeholder: "e.g., Caption for model setup figure"
      description: | 
        Provide a model setup image by dragging an image file into this box. Max file size is 2 Mb. 
        Add a figure caption to describe your model setup, e.g., The model uses a cartesian domain, with size 200 km x 200 km x 300 km.

  - type: markdown
    attributes:
      value: "## Section 5: Submission and the next steps"

  - type: markdown
    attributes:
      value: |
        To submit the model, Click the **Create** button below. 
        This will alert the M@TE team to your submission and get the process started to include your model in the M@TE collection. 
        Once you hit **Create** the M@TE team will review your model and contact you via GitHub and the generated GitHub Issue. 
        All steps in the M@TE process are explained at https://github.com/ModelAtlasofTheEarth/model_submission/blob/main/README.md
